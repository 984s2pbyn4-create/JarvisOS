<head>
  <meta charset="UTF-8" />

  <meta name="theme-color" content="#050b18" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="JARVIS OS" />
  <meta name="description" content="JARVIS OS для iPad — автономный персональный командный центр." />
  <link rel="manifest" href="./manifest.webmanifest" />

  <title>JARVIS OS — iPad Edition 3.0.0</title>
</head>
<body>
  <div id="app"><div class="boot"><div class="boot-core">J</div><strong>JARVIS OS</strong><small>ИНИЦИАЛИЗАЦИЯ ИНТЕРФЕЙСА</small></div></div>
  <script>
  window.addEventListener('error', function(e){
    if(document.querySelector('.boot')) document.querySelector('.boot small').textContent='ОШИБКА ЗАГРУЗКИ: проверьте файлы обновления';
  });
  setTimeout(function(){const boot=document.querySelector('.boot');if(boot){
    boot.querySelector('small').textContent='ЗАПУСК ЗАДЕРЖИВАЕТСЯ. ОТКРОЙТЕ СТРАНИЦУ В SAFARI И ПРОВЕРЬТЕ ОБНОВЛЕНИЕ.';
  }},12000);
  </script>
  <script type="module" src="./app.js?v=3.0.0"></script>
</body>
